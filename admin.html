<!doctype html>
<html lang="en">
<head>
<script>
/* Admin-only page. Leave before anything renders — before the title commits,
   before the markup parses — so a coach never sees that this page exists.
   Fails closed: a missing, malformed or expired session is not an admin.
   `until` is stamped by gate.js so this has no config to duplicate. */
(function () {
  var ok = false;
  try {
    var s = JSON.parse(localStorage.getItem('bb.admin.v1') || 'null');
    ok = !!(s && s.token && typeof s.until === 'number' && s.until > Date.now());
    // With sign-in switched off there is no admin to be, and this page belongs
    // to everyone again. An absent marker means gate.js has not run here yet,
    // so leave the decision to the module rather than guessing.
    if (localStorage.getItem('bb.gate.on') !== '1') ok = true;
  } catch (e) { ok = false; }
  if (!ok) location.replace('playbook.html');
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin</title>
<meta name="description" content="Who has signed in to Coach Tools.">
<script>
/* Hide the page until gate.js decides whether a sign-in is needed.
   The timer is the failsafe for one case only: gate.js never loading. It is
   cancelled by gate.js's first statement, so a slow sign-in cannot reveal the
   page behind the popup. */
document.documentElement.classList.add('gated');
window.__gateFailsafe = setTimeout(function () {
  document.documentElement.classList.remove('gated');
}, 3000);
</script>

</head>
