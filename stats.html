<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stats Tracker</title>
<meta name="description" content="Team and player basketball stats from a published Google Sheet.">
<script>
/* Hide the page until gate.js decides whether a sign-in is needed.
   The timer is the failsafe for one case only: gate.js never loading. It is
   cancelled by gate.js's first statement, so a slow sign-in cannot reveal the
   page behind the popup. */
document.documentElement.classList.add('gated');
window.__gateFailsafe = setTimeout(function () {
  document.documentElement.classList.remove('gated');
}, 3000);
</script>
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🏀</text></svg>">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">🏀 Coach<span>Tools</span></a>
    <nav class="site-nav">
      <a href="index.html">Home</a>
      <a href="stats.html" aria-current="page">Stats</a>
      <a href="playbook.html">Playbook</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <h1>Stats Tracker</h1>
  <p class="lede">Pick any players to see their combined numbers, then open a game for the full
    box score.</p>

  <div id="banner" class="banner" hidden></div>

  <!-- Stands in for the whole page when there is no admin session. -->
  <div id="admin-gate" hidden></div>

  <div id="stats-body">

  <!-- ---------------- player filter ---------------- -->
  <section class="card">
    <div class="chips-head">
      <h2>Players</h2>
      <div class="chips-actions">
        <div class="segmented" role="group" aria-label="Match mode">
          <button type="button" id="m-all" aria-pressed="true" title="Games where every selected player played">All</button>
          <button type="button" id="m-any" aria-pressed="false" title="Games where at least one selected player played">Any</button>
        </div>
        <button type="button" class="btn" id="btn-clear">Clear</button>
      </div>
    </div>
    <div class="chips" id="player-chips"></div>
    <p class="small muted" id="filter-hint"></p>

    <div class="filters compact">
      <div class="field">
        <label for="f-ha">Home / Away</label>
        <select id="f-ha">
          <option value="">All games</option>
          <option value="Home">Home only</option>
          <option value="Away">Away only</option>
        </select>
      </div>
    </div>
  </section>

  <!-- ---------------- summary ---------------- -->
  <section class="card" id="summary-card">
    <div class="empty">Loading…</div>
  </section>

  <!-- ---------------- games ---------------- -->
  <div class="toolbar">
    <h2 class="section-label" style="margin:0">Games</h2>
    <span class="spacer"></span>
    <button type="button" class="btn" id="btn-refresh">Refresh</button>
  </div>

  <div id="game-list"></div>

  <!-- ---------------- connection ----------------
       Hidden entirely while the sheet is healthy; revealed only when
       something needs attention. -->
  <div id="sheet-section" hidden>
    <h2 class="section-label">Sheet</h2>
    <details class="panel" id="conn-panel">
      <summary>Connection <span id="conn-pill" class="pill">checking…</span></summary>
      <div class="panel-body" id="conn-body"></div>
    </details>
  </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <a href="admin.html">Admin</a>
  </div>
</footer>


<script type="module" src="assets/js/gate.js"></script>
<script type="module" src="assets/js/stats.js"></script>
</body>
</html>
